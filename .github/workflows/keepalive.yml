name: Keep Alive

on:
  schedule:
    - cron: '30 0 * * *'  # Roz 6:00 AM IST — agent se 1 ghante pehle
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep repo active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 20
