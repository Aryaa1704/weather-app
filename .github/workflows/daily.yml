name: LeetCode Daily Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  solve-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LeetCode Agent
        id: run_agent
        env:
           LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
           LEETCODE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
           LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
           GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
           GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
           NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
           CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
           SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
           MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
           OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
           CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
           CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
           HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agent.py

      - name: Send cookie expired alert
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "⚠️ LeetCode Agent Failed — Fix Karo!"
          to: ${{ secrets.ALERT_EMAIL }}
          from: LeetCode Agent
          body: |
            Tera LeetCode agent aaj fail hua!
            
            LEETCODE_SESSION cookie expire ho gayi hogi.
            
            Fix:
            1. leetcode.com login karo
            2. F12 → Application → Cookies → LEETCODE_SESSION copy karo  
            3. GitHub → Secrets → LEETCODE_SESSION update karo
            4. Actions → Run workflow manually
            
            — LeetCode Agent 🤖
