name: LeetCode Profile Growth Agent

on:
  schedule:
    # 08:00 AM IST every day (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run profile, contest and community-draft agent
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python growth_agent.py

      - name: Upload reviewed community drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-community-drafts
          path: community_drafts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure in GitHub Actions
        if: failure()
        run: |
          echo "## LeetCode Growth Agent failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step logs, check the LeetCode session cookie and configured API secrets, then rerun." >> "$GITHUB_STEP_SUMMARY"
